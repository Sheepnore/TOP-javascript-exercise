  <script>
  const fibonacci = function(sequenceNum) {
  // Generate the array based on sequence number
  // Use for loop to generate and store two previouse array elements;
  // Use the previouse elem to calculate the current elem; e.g. prev1 + prev2
  // [1,1,2,3,5,8]
  sequenceNum = Number(sequenceNum);
  
  if (sequenceNum >=1 && sequenceNum <=2){
    return 1;
  }
  else if (sequenceNum === 0 ){
    return 0;
  }
  else if (sequenceNum < 0){
    return 'OOPS'
  }


  let prevFrist = 1, prevSecond = 1;
  let currentNum;

  for (let i = 2; i<sequenceNum; i++){
   currentNum = prevFrist + prevSecond;
   prevFrist = prevSecond; 
   prevSecond = currentNum;
   console.log(currentNum);
  }

  return currentNum;
 };
  fibonacci(5);
  </script>
